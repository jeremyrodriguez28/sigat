{% extends "base.html" %}
{% block titulo %}Editar Cliente{% endblock %}
{% block titulo_pagina %}Editar Cliente{% endblock %}

{% block contenido %}

<div class="panel">
 <div class="panel-titulo">
 <h2>Editar Cliente</h2>
 <a href="{{ url_for('clientes') }}" class="btn btn-borde">Volver</a>
 </div>
 <form method="POST">
 <div class="form-grid">
 <div>
 <label>Nombre / Razón social</label>
 <input type="text" name="nombre" value="{{ cliente.nombre }}" required>
 </div>
 <div>
 <label>Contacto</label>
 <input type="text" name="contacto" value="{{ cliente.contacto }}" required>
 </div>
 <div>
 <label>Teléfono</label>
 <input type="text" name="telefono" value="{{ cliente.telefono }}">
 </div>
 <div>
 <label>Correo</label>
 <input type="email" name="correo" value="{{ cliente.correo }}">
 </div>
 </div>
 <button type="submit" class="btn btn-azul">Guardar cambios</button>
 </form>
</div>

{% endblock %}
